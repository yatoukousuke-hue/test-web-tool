<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研修ナビ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="研修ナビ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6F4EE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#E6F4EE;overflow:hidden}
  iframe{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#E6F4EE}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 15px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:#1D1B3A;background:#E6F4EE;transition:opacity .3s}
  #load img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(29,27,58,.18)}
  #load a{font-size:13px;color:#3355FF}
  #load.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="load"><img src="icon-180.png" alt=""><div>研修ナビをひらいています…</div><a id="fb" href="#" hidden>ひらかないときはこちら</a></div>
<iframe id="app" title="リーダー先生研修ナビ" allow="clipboard-write; fullscreen"></iframe>
<script>
  var APP="https://script.google.com/macros/s/AKfycbwj_o2QOvTg0fuTFaq9gl832RnnrlsGyNM3QfigFRLMmBq8an5g6VhVthUk3vlwlyxg/exec";
  var f=document.getElementById("app"), ld=document.getElementById("load"), fb=document.getElementById("fb");
  fb.href=APP;
  f.onload=function(){ ld.className="hide"; };
  f.src=APP;
  setTimeout(function(){ fb.hidden=false; }, 8000);
</script>
</body>
</html>
