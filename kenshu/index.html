<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研修ナビ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="研修ナビ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6F4EE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#E6F4EE;overflow:hidden}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 15px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:#1D1B3A;background:#E6F4EE;transition:opacity .3s}
  #load img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(29,27,58,.18)}
  #load a{font-size:14px;color:#fff;background:#3355FF;padding:10px 18px;border-radius:999px;text-decoration:none}
</style>
</head>
<body>
<div id="load"><img src="icon-180.png" alt=""><div>研修ナビをひらいています…</div><a id="fb" href="#" hidden>ひらかないときはこちら</a></div>
<script>
  // アプリ本体（Apps Script）を直接ひらく。iPhoneのホーム画面から埋め込み表示すると真っ白になることがあるため
  var APP="https://script.google.com/macros/s/AKfycbwj_o2QOvTg0fuTFaq9gl832RnnrlsGyNM3QfigFRLMmBq8an5g6VhVthUk3vlwlyxg/exec";
  var fb=document.getElementById("fb"); fb.href=APP;
  setTimeout(function(){ location.replace(APP); }, 300);
  setTimeout(function(){ fb.hidden=false; }, 4000);
</script>
</body>
</html>
